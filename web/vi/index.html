  <noscript><div class="nojs"><div>
    <h1>Việt Nam kiểu Civ</h1>
    <p>Bản đồ này vẽ Việt Nam thật kiểu Civ: địa hình ô lục giác, 34 tỉnh, thành phố, đô thị, lớp bản đồ và một hội đồng cố vấn. Mọi con số đều từ dữ liệu công khai. Bản đồ cần JavaScript để chạy.</p>
  </div></div></noscript>
  <header id="topbar">
    <div class="brand" title="Việt Nam kiểu Civ"><svg class="brand-emblem" aria-hidden="true" viewBox="0 0 64 64" width="26" height="26"><path d="M32 4l24 14v28L32 60 8 46V18z" fill="#0b1a26"/><path d="M32 7.5l21 12.2v24.6L32 56.5 11 44.3V19.7z" fill="#c9a45c"/><path d="M32 11l18 10.5v21L32 53 14 42.5v-21z" fill="#1d7a8c"/><path d="M20 40c4-2 8 2 12 0s8 2 12 0" fill="none" stroke="#f4ecd8" stroke-width="2.4" stroke-linecap="round"/><path d="M32 17v18l9-3.5z" fill="#f4ecd8"/><path d="M32 17l-8 15 8 3z" fill="#e2bf6e"/></svg><span class="brand-words"><span class="brand-text">Việt Nam</span><i class="brand-tag">Việt Nam kiểu Civ</i></span></div>
    <div id="yields" class="yields" aria-label="Số liệu toàn quốc"></div>
    <div class="spacer"></div>
    <div class="search" role="search">
      <span class="search-ic" aria-hidden="true"></span>
      <input id="search-input" type="search" placeholder="Tìm đô thị và tỉnh, thành phố" autocomplete="off" spellcheck="false"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" aria-label="Tìm đô thị và tỉnh, thành phố (/ hoặc Ctrl K)">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </div>
    <div id="turn" class="turn"></div>
    <div class="tb-buttons">
      <button id="btn-share" class="btn" aria-haspopup="dialog" aria-expanded="false" aria-label="Chia sẻ góc nhìn này" title="Chia sẻ: sao chép liên kết hoặc tải ảnh xuống"></button>
      <button id="btn-help" class="btn btn-icon" aria-label="Trợ giúp bàn phím và chuột" title="Trợ giúp (?)"></button>
      <button id="btn-pedia" class="btn" aria-label="Mở Niên giám" title="Ý nghĩa và nguồn gốc của mọi con số"></button>
    </div>
    <nav id="lang-switch" class="lang-switch" aria-label="Ngôn ngữ"><a href="../" hreflang="en" lang="en" data-lang="en">EN</a><a href="./" hreflang="vi" lang="vi" data-lang="vi" aria-current="page">VI</a></nav>
  </header>

  <canvas id="map" role="img" aria-label="Bản đồ lục giác Việt Nam"></canvas>

  <div id="tooltip" class="tooltip" hidden></div>
  <aside id="city-panel" class="panel" hidden role="region" aria-label="Chi tiết"></aside>

  <div id="lens-area">
    <div id="lens-picker" class="panel lens-picker" hidden role="dialog" aria-label="Chọn lớp bản đồ"></div>
    <div id="legend" class="panel legend" hidden role="group" aria-label="Chú giải lớp bản đồ"></div>
    <div id="lens-dock" class="panel lens-dock" role="toolbar" aria-label="Các lớp bản đồ">
      <button id="btn-res" class="lens-btn res-toggle" aria-pressed="true" aria-label="Tài nguyên trên ô (R)" title="Hiện hoặc ẩn tài nguyên trên ô (R)" hidden></button>
      <div id="lens-quick" class="lens-quick"></div>
      <button id="btn-lenses" class="lens-btn lens-more" aria-haspopup="dialog" aria-expanded="false" aria-controls="lens-picker"></button>
    </div>
  </div>

  <div id="minimap-wrap" class="panel"><canvas id="minimap" aria-label="Bản đồ nhỏ: nhấp để chuyển đến" role="img"></canvas></div>
  <button id="btn-minimap" class="panel minimap-toggle" aria-pressed="false" aria-controls="minimap-wrap" aria-label="Hiện bản đồ nhỏ"></button>

  <div id="search-results" class="panel search-results" role="listbox" aria-label="Kết quả tìm kiếm" hidden></div>
  <div id="share-pop" class="panel share-pop" role="dialog" aria-label="Chia sẻ" hidden></div>
  <div id="yield-report" class="panel yield-report" role="dialog" aria-label="Báo cáo toàn quốc" tabindex="-1" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div id="pedia" class="modal" hidden>
    <div class="modal-card panel" role="dialog" aria-modal="true" aria-label="Niên giám">
      <button class="close icon-btn" data-close aria-label="Đóng Niên giám">&#x2715;</button>
      <nav id="pedia-nav" aria-label="Các trang Niên giám"></nav>
      <article id="pedia-body"></article>
    </div>
  </div>

  <div id="help" class="modal" hidden>
    <div class="help-card panel" role="dialog" aria-modal="true" aria-labelledby="help-title"></div>
  </div>

  <div id="loading"><span class="ld-title">Việt Nam</span><i>Đang khảo sát địa hình...</i></div>
